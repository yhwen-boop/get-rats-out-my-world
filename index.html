<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Get Rats Out My World</title>
</head>
<body>
<style>
/* Layout: 16色像素RPG —— 左侧主对话窗（头像+名牌+台词、▶光标选项），右侧 STATUS / 图鉴 / 道具栏三个小窗；窄屏上下堆叠。单一暗色复古画面（刻意不做亮色主题） */
@font-face{font-family:"FusionPixel";src:url("fonts/fusion-pixel-12px-zh_hans.woff2") format("woff2");font-display:swap}
:root{
  --void:#0d0e1a;      /* 屏幕外 */
  --win:#1a1c2c;       /* 窗口底色 */
  --win-2:#232741;
  --frame:#f4f4f4;     /* 窗框白 */
  --frame-in:#566c86;  /* 内框 */
  --ink:#f4f4f4;
  --muted:#94b0c2;
  --dim:#566c86;
  --gold:#ffcd75;      /* 光标/证据/星标 */
  --rat:#ef7d57;       /* 蛀虫 */
  --red:#b13e53;
  --good:#a7f070;
  --green:#38b764;
  --cyan:#73eff7;      /* 内心OS */
  --blue:#41a6f6;
  --navy:#29366f;
  --f-pixel:"FusionPixel","PingFang SC","Microsoft YaHei",monospace;
  --fs:18px; --fs-s:12px; --fs-l:24px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--void);color:var(--ink);font-family:var(--f-pixel);font-size:var(--fs);line-height:1.6;
  -webkit-font-smoothing:none;font-smooth:never;text-rendering:optimizeSpeed;
  background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px);background-size:100% 3px}
button{font:inherit;color:inherit}
img.px{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.wrap{max-width:1200px;margin:0 auto;padding-inline:16px;padding-block:16px 48px}

/* 像素窗口：白外框 + 灰内框 + 切角 */
.win{background:var(--win);border:3px solid var(--frame);box-shadow:inset 0 0 0 3px var(--win),inset 0 0 0 6px var(--frame-in);
  clip-path:polygon(6px 0,calc(100% - 6px) 0,100% 6px,100% calc(100% - 6px),calc(100% - 6px) 100%,6px 100%,0 calc(100% - 6px),0 6px);position:relative;min-width:0}
.win-title{position:absolute;top:-1px;left:18px;background:var(--frame);color:var(--win);font-size:var(--fs-s);padding:0 8px;line-height:18px;letter-spacing:.1em}

/* 顶栏 */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;margin-bottom:18px}
.brand{font-size:var(--fs-l);line-height:1.2;color:var(--gold);text-shadow:3px 3px 0 var(--red)}
.brand small{display:block;font-size:var(--fs-s);color:var(--muted);text-shadow:none;letter-spacing:.08em}
.clock{margin-left:auto;display:flex;align-items:center;gap:14px;font-size:var(--fs-s)}
.clock .day{padding:2px 10px;background:var(--frame);color:var(--win)}
.pips{display:flex;gap:4px;align-items:center}
.pips i{width:12px;height:12px;background:var(--dim);display:block}
.pips i.on{background:var(--gold);box-shadow:inset -3px -3px 0 #d39a3f}
.iconbtn{background:var(--win);border:2px solid var(--dim);padding:2px 10px;font-size:var(--fs-s);cursor:pointer;color:var(--muted)}
.iconbtn:hover,.iconbtn:focus-visible{border-color:var(--gold);color:var(--gold);outline:none}

.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
@media (max-width:880px){.grid{grid-template-columns:minmax(0,1fr)}}

/* 主窗 */
.scene{padding:26px 26px 20px}
@media (max-width:520px){.scene{padding:22px 16px 16px}}
.scene-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:var(--fs-s);color:var(--muted);padding-bottom:12px;margin-bottom:16px;border-bottom:3px dotted var(--dim)}
.scene-head b{color:var(--gold);font-weight:400}
.scene-body{display:flex;flex-direction:column;gap:16px}
.narr{margin:0;max-width:40em}
.sys{margin:0;font-size:var(--fs-s);color:var(--gold);line-height:1.8}
.sys::before{content:"» "}
.h3{font-size:var(--fs-s);color:var(--muted);letter-spacing:.12em;margin-top:4px}
.os{color:var(--cyan);border:2px dashed var(--navy);padding:12px 14px;background:rgba(65,166,246,.06)}
.os .tag{display:inline-block;font-size:var(--fs-s);background:var(--cyan);color:var(--win);padding:0 6px;margin-bottom:6px}
.os p{margin:0 0 .5em}.os p:last-child{margin:0}

/* 对话：头像 + 名牌 + 台词框 */
.dlg{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:start;max-width:92%}
.dlg .face{width:52px;height:52px;background:var(--win-2);border:3px solid var(--frame-in);padding:2px}
.dlg .face img{width:42px;height:42px}
.dlg .box{background:var(--win-2);border:3px solid var(--frame-in);padding:8px 12px 10px;position:relative;min-width:0}
.dlg .nm{display:inline-block;font-size:var(--fs-s);background:var(--frame-in);color:var(--ink);padding:0 8px;margin:-8px 0 6px -12px}
.dlg.rat .face,.dlg.rat .box{border-color:var(--rat)}
.dlg.rat .nm{background:var(--rat);color:var(--win)}
.dlg.me{align-self:flex-end;grid-template-columns:minmax(0,1fr) 52px}
.dlg.me .face{order:2;border-color:var(--blue)}
.dlg.me .box{border-color:var(--blue);background:#1d2c4a}
.dlg.me .nm{background:var(--blue);color:var(--win)}
@media (max-width:520px){.dlg{max-width:100%;grid-template-columns:40px minmax(0,1fr);gap:8px}.dlg.me{grid-template-columns:minmax(0,1fr) 40px}.dlg .face{width:40px;height:40px;padding:1px}.dlg .face img{width:32px;height:32px}}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:var(--fs-s);padding:1px 8px;border:2px solid var(--dim);color:var(--muted)}
.chip.good{border-color:var(--green);color:var(--good)}
.chip.bad{border-color:var(--red);color:var(--rat)}
.chip.ev{border-color:var(--gold);color:var(--gold)}
.chip.expel{background:var(--red);border-color:var(--red);color:var(--ink)}
.chip.buff{border-style:dashed;color:var(--ink)}

/* 选项：▶ 光标 */
.choices{display:flex;flex-direction:column;gap:4px;margin-top:20px;padding-top:14px;border-top:3px dotted var(--dim)}
.choice{display:grid;grid-template-columns:22px 28px minmax(0,1fr);gap:2px 4px;text-align:left;background:none;border:0;padding:6px 8px;cursor:pointer}
.choice .cur{color:var(--gold);visibility:hidden}
.choice .k{color:var(--dim)}
.choice .t{color:var(--ink)}
.choice .d{grid-column:3;font-size:var(--fs-s);color:var(--muted);line-height:1.6}
.choice:hover,.choice:focus-visible{background:var(--win-2);outline:none}
.choice:hover .cur,.choice:focus-visible .cur{visibility:visible;animation:blink 1s steps(1) infinite}
.choice:hover .t,.choice:focus-visible .t{color:var(--gold)}
.choice.star .t{color:var(--gold)}
.choice.star .k::after{content:"★";color:var(--gold)}
.choice.star .k{font-size:0}
.choice.star .k::after{font-size:var(--fs)}
.choice.locked{cursor:not-allowed}
.choice.locked .t{color:var(--dim)}
.choice.locked .d{color:var(--dim)}
.choice.locked:hover{background:none}.choice.locked:hover .cur{visibility:hidden}
.choice.primary .t{color:var(--gold)}
.choice.primary .cur{visibility:visible;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{visibility:hidden}}

/* 日期卡 */
.daycard{display:flex;align-items:center;gap:16px;padding:6px 0 4px}
.daycard b{font-weight:400;font-size:48px;line-height:1;color:var(--gold);text-shadow:4px 4px 0 var(--red)}
.daycard span{font-size:var(--fs-s);color:var(--muted);line-height:1.6}

/* 侧栏 */
.side{display:flex;flex-direction:column;gap:22px;min-width:0}
.panel{padding:24px 18px 16px}
.stat{display:grid;grid-template-columns:4.6em minmax(0,1fr) 2.2em;align-items:center;gap:8px;font-size:var(--fs-s);margin-bottom:8px}
.stat .v{text-align:right;font-variant-numeric:tabular-nums}
.seg{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;height:12px}
.seg i{background:var(--win-2)}
.seg.stress i.on{background:var(--rat)} .seg.stress.hot i.on{background:var(--red)}
.seg.trust i.on{background:var(--green)}
.seg.neutral i.on{background:var(--gold)}
.seg.alert i.on{background:var(--red)}
.outdots{display:flex;gap:3px}
.outdots i{width:16px;height:12px;background:var(--win-2)}
.outdots i.on{background:var(--blue)}
.debuffs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}

.tabs{display:flex;gap:4px;margin:0 0 14px;flex-wrap:wrap}
.tab{background:none;border:2px solid var(--dim);padding:0 10px;cursor:pointer;font-size:var(--fs-s);color:var(--muted)}
.tab[aria-selected="true"]{background:var(--frame);border-color:var(--frame);color:var(--win)}
.tab:focus-visible{outline:2px solid var(--gold)}

.rats{display:flex;flex-direction:column;gap:8px}
.rat{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:center;background:var(--win-2);border:2px solid transparent;padding:6px 8px;text-align:left;cursor:pointer;position:relative}
.rat:hover,.rat:focus-visible{border-color:var(--gold);outline:none}
.rat img{width:44px;height:44px}
.rat .nm{font-size:var(--fs);line-height:1.2;display:flex;gap:8px;align-items:baseline}
.rat .nm em{font-style:normal;font-size:var(--fs-s);padding:0 5px;background:var(--rat);color:var(--win)}
.rat.out .nm em{background:var(--red);color:var(--ink)}
.rat .tg{font-size:var(--fs-s);color:var(--muted);line-height:1.5;margin:2px 0 4px}
.rat.unseen{opacity:.6}
.rat.out img{filter:grayscale(1) brightness(.7)}

.evlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.evi{aspect-ratio:1;max-width:100%;background:var(--win-2);border:2px solid var(--dim);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:var(--fs-s);cursor:pointer;padding:0;color:var(--dim)}
.evi .ico{width:22px;height:16px;background:var(--dim);margin-bottom:4px;box-shadow:inset 0 3px 0 rgba(0,0,0,.25)}
.evi.got{border-color:var(--gold);color:var(--gold)}
.evi.got .ico{background:var(--gold)}
.evi:hover,.evi:focus-visible{outline:2px solid var(--ink)}
.evdesc{margin-top:10px;font-size:var(--fs-s);line-height:1.7;min-height:3.4em;border-top:2px dotted var(--dim);padding-top:8px;color:var(--muted)}
.evdesc b{color:var(--gold);font-weight:400}
.log{font-size:var(--fs-s);color:var(--muted);display:flex;flex-direction:column;gap:6px;max-height:320px;overflow:auto;line-height:1.6}
.log div{border-bottom:2px dotted var(--win-2);padding-bottom:4px}
.empty{font-size:var(--fs-s);color:var(--muted)}

/* 标题 */
.title-screen{display:flex;flex-direction:column;gap:22px;padding:18px 4px 6px}
.title-screen .big{font-weight:400;font-size:clamp(36px,7vw,72px);line-height:1.05;margin:0;color:var(--ink);text-shadow:4px 4px 0 var(--navy)}
.title-screen .big span{color:var(--rat);text-shadow:4px 4px 0 var(--red)}
.title-screen .cn{color:var(--muted);max-width:30em;margin:0}
.roster{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:620px){.roster{grid-template-columns:repeat(2,minmax(0,1fr))}}
.roster div{background:var(--win-2);padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.roster img{width:60px;height:60px;animation:bob 1.2s steps(2) infinite}
.roster div:nth-child(2) img{animation-delay:.3s}.roster div:nth-child(3) img{animation-delay:.6s}.roster div:nth-child(4) img{animation-delay:.9s}
.roster b{font-weight:400;font-size:var(--fs-l);line-height:1.1}
.roster small{color:var(--muted);font-size:var(--fs-s);line-height:1.5}
@keyframes bob{50%{transform:translateY(-3px)}}
.press{color:var(--gold);font-size:var(--fs-s);letter-spacing:.2em;animation:blink 1.2s steps(1) infinite}

.lurk{display:flex;gap:14px;align-items:flex-end}
.lurk img{width:56px;height:56px;opacity:.55}
.lurk .sus{position:relative}
.lurk .sus img{opacity:1;animation:bob 1.2s steps(2) infinite}
.lurk .sus i{position:absolute;top:-14px;right:-6px;font-style:normal;color:var(--gold);animation:blink 1s steps(1) infinite}
.reveal{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.reveal .choices{align-self:stretch}
.morph{position:relative;width:120px;height:120px;margin:8px 0 4px;background:var(--win-2);border:3px solid var(--rat)}
.morph img{position:absolute;inset:6px;width:102px;height:102px}
.morph .a{animation:hideA 1.6s steps(1) forwards}
.morph .b{animation:showB 1.6s steps(1) forwards}
@keyframes hideA{0%{opacity:1}35%{opacity:0}45%{opacity:1}55%{opacity:0}65%{opacity:1}75%,100%{opacity:0}}
@keyframes showB{0%{opacity:0}35%{opacity:1}45%{opacity:0}55%{opacity:1}65%{opacity:0}75%,100%{opacity:1}}
.rv-no{font-size:var(--fs-s);color:var(--gold);letter-spacing:.2em}
.rv-tag{font-size:var(--fs-s);color:var(--muted)}
.reveal .narr{font-size:var(--fs);color:var(--ink);text-align:center;margin:10px auto 0}
.reveal .narr b{color:var(--rat);font-weight:400}

/* 结局 */
.ending-tag{font-size:var(--fs-s);letter-spacing:.14em;color:var(--rat)}
.scene h2{font-weight:400;font-size:40px;line-height:1.15;margin:0;color:var(--gold);text-shadow:4px 4px 0 var(--red)}
.verdict{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:620px){.verdict{grid-template-columns:repeat(2,minmax(0,1fr))}}
.verdict div{background:var(--win-2);padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px}
.verdict img{width:48px;height:48px}
.verdict em{font-style:normal;font-size:var(--fs-s);color:var(--muted)}
.verdict .y em{color:var(--ink);background:var(--red);padding:0 6px}
.verdict .y img{filter:grayscale(1) brightness(.7)}

/* 弹窗 */
.modal{position:fixed;inset:0;background:rgba(13,14,26,.8);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.card{max-width:480px;width:100%;padding:26px 22px 18px;max-height:90vh;overflow:auto}
.card .hd{display:flex;gap:16px;align-items:center}
.card .hd img{width:72px;height:72px;background:var(--win-2);padding:4px}
.card .nm{font-size:40px;line-height:1;color:var(--rat)}
.card dl{display:grid;grid-template-columns:5em minmax(0,1fr);gap:8px 12px;margin:16px 0;font-size:var(--fs-s);line-height:1.7}
.card dt{color:var(--gold)}
.card dd{margin:0}
.card .narr{font-size:var(--fs-s);line-height:1.8;color:var(--muted);margin-top:12px}

.fade{animation:pop .22s steps(3) both}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade,.roster img,.lurk img,.lurk i,.press,.choice .cur{animation:none!important}.morph .a{opacity:0}.morph .b{opacity:1}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">GET RATS OUT MY WORLD<small>驱鼠办公室</small></div>
    <div class="clock" id="clock"></div>
  </header>
  <div class="grid">
    <main class="scene win" id="scene" aria-live="polite"></main>
    <aside class="side" id="side"></aside>
  </div>
</div>
<div class="modal" id="modal" hidden></div>

<script>
/* ============ 数据 ============ */
const RATS = {
  r1:{name:'闻灏', tag:'越界派活 · 双标 · 爱指挥平级', story:'主线核心Rat。加两天班就觉得自己有资格给别的组派活，点子归他，脏活归你。', how:'用证据和书面分工，堵死"平级口头派活"这条路。'},
  r2:{name:'汶昊', tag:'抢功劳 · 偷方案 · 甩锅栽赃', story:'手上没什么拿得出手的产出，于是盯上了你的。改个页眉，删掉编辑记录，方案就成了他的。', how:'版本历史、时间戳、证人。让"移花接木"在核验面前失效。'},
  r3:{name:'玟颢', tag:'打小报告 · 茶水间造谣 · 挑拨', story:'从不正面冲突。半句真话掺半句假话，在茶水间、在领导私聊里，把你的维权说成"难合作"。', how:'收集证言和他打小报告的记录，让碎片谣言拼不成形。'},
  r4:{name:'雯灏', tag:'PUA · 画大饼 · 道德绑架', story:'从不写工单，只讲人情。"大家都在扛""别分这么清楚"。功劳算集体，锅算干活的人。', how:'把口头人情变成书面任务。没有书面，就没有义务。'},
};
const RAT_TEMPLATE = {tag:'文浩系蛀虫', trait:'披着普通同事的外壳，用体面话术转嫁成本、掠夺他人成果', goal:'击碎他赖以得逞的规则漏洞，让他的越界手段失效'};

const EV = {
  E01:{name:'工单分配记录', desc:'过往多份需求，闻灏只输出需求描述，落地全部指派本组，本人无交付产出。'},
  E02:{name:'打卡导出记录', desc:'近22个工作日，闻灏19天准点/提前离岗，仅2天加班。'},
  E03:{name:'历史私聊失联记录', desc:'之前约定联调，到点直接下班失联。'},
  E04:{name:'同步会会议纪要', desc:'闻灏在会上原话："主要是你们组维护、调试规则。"'},
  E05:{name:'私聊：回避分工边界', desc:'闻灏拒绝写明承接范围和排期，"先跑起来再说"。'},
  E06:{name:'私聊：证据对质归档', desc:'你逐条摆出工单与打卡记录，闻灏回复"我知道了，我找组长对齐"。'},
  E07:{name:'外组塞活截图', desc:'隔壁组陈蔓发来的截图：闻灏用同一套话术给他们组塞过活。'},
  E08:{name:'文档版本历史', desc:'方案文档全部版本、草稿与提交时间戳，作者均为你。'},
  E09:{name:'茶水间证言', desc:'在场同事确认：玟颢说你"配合度差、爱顶撞跨组同事"。'},
  E10:{name:'小报告记录', desc:'玟颢私下发给组长的消息，把你的边界维权描述成"情绪化、难合作"。'},
  E11:{name:'口头派活录音 / 书面任务单', desc:'雯灏靠人情话术让你无偿兜底的完整记录。'},
  E12:{name:'双鼠口径对照表', desc:'闻灏和汶昊在不同场合说法前后矛盾的逐条对照。'},
  E13:{name:'蛀虫互撕截图', desc:'闻灏与汶昊互相甩锅、互爆黑料的聊天记录。'},
};
const R1_EV = ['E01','E02','E03','E04','E05','E06','E07'];
const DAYS = ['','W1 周一','W1 周二','W1 周三','W1 周四','W1 周五','W2 周一','W2 周二','W2 周三'];
const LAST_DAY = 8;

/* ============ 状态 ============ */
const fresh = () => ({day:1, ap:3, stress:30, trust:50, neutral:50, output:0,
  alert:{r1:10,r2:5,r3:5,r4:5}, ev:[], flags:{}, seen:{}, expelled:{}, log:[], scene:'title', reveal:[],
  morning:[], out:null, pendingTo:null, ending:null, tab:'rats'});
let S = fresh();
const has = e => S.ev.includes(e);
const f = () => S.flags;
const clamp = v => Math.max(0, Math.min(100, v));
const r1Count = () => R1_EV.filter(has).length;
function markSeen(r){ if(!S.seen[r]){ S.seen[r] = true; (S.reveal = S.reveal || []).push(r); } }

function save(){ try{ localStorage.setItem('grom-save', JSON.stringify(S)); }catch(e){} }
function load(){ try{ const t = localStorage.getItem('grom-save'); return t ? JSON.parse(t) : null; }catch(e){ return null; } }

function applyFx(fx){
  const out = [];
  const st = (k, label, v) => { if(!v) return; S[k] = clamp(S[k] + v); out.push({label, v, k}); };
  st('stress','压力值',fx.stress); st('trust','组长信任',fx.trust); st('neutral','中立好感',fx.neutral);
  if(fx.output){ S.output = Math.max(0, S.output + fx.output); out.push({label:'业务产出', v:fx.output, k:'output'}); }
  if(fx.alert) for(const r in fx.alert){ S.alert[r] = clamp(S.alert[r] + fx.alert[r]); markSeen(r); out.push({label:RATS[r].name+' 戒备值', v:fx.alert[r], k:'alert'}); }
  if(fx.ev) for(const e of [].concat(fx.ev)) if(!has(e)){ S.ev.push(e); out.push({label:'获得证据 '+e+'｜'+EV[e].name, ev:true}); }
  if(fx.expel) for(const r of [].concat(fx.expel)) if(!S.expelled[r]){ S.expelled[r] = true; markSeen(r); out.push({label:'驱逐成功：'+RATS[r].name, expel:true}); }
  if(fx.see) for(const r of [].concat(fx.see)) markSeen(r);
  if(fx.set) Object.assign(S.flags, fx.set);
  if(fx.buff) for(const b of [].concat(fx.buff)) out.push({label:b, buff:true});
  if(out.length) S.log.unshift(DAYS[S.day]+'：'+out.map(c => c.v ? `${c.label} ${c.v>0?'+':''}${c.v}` : c.label).join('，'));
  S.log = S.log.slice(0,60);
  return out;
}

/* 早间强制事件队列 */
function morningRoute(){
  const fl = f();
  if(S.day === 3 && !fl.meetingDone) return 'meeting';
  if(S.day === 4 && !fl.d4Done) return 'd4chain';
  if(fl.r2Pending && !fl.r2Reviewed) return 'r2review';
  if(S.day >= 6 && !fl.linkDone){
    if(S.alert.r1 >= 40 && !S.expelled.r2 && fl.r2Done) return 'ally';
    if(S.alert.r1 >= 15 && fl.r2Done) return 'feud';
    S.flags.linkDone = true;
  }
  return 'hub';
}
/* 晚间强制事件队列 */
function eveningRoute(){
  const fl = f();
  if(!fl.r2Done && S.output >= 2 && S.day >= 4 && S.day < LAST_DAY) return 'r2eve';
  if(S.day === 5 && !fl.r4Done) return 'friday';
  if(S.day === LAST_DAY) return 'finale';
  return 'night';
}

SC.finale = () => {

    return {loc:'终局', blocks:[...blocks, N('经理会上，你写的《跨组任务书面认领流程》草案过了。老周在群里发通知的时候，@了你。')], choices:[{t:'看结局', to:'end', act:() => S.ending = 'root', primary:true}]};
  }
  const ch = [];
  if(fl.offer) ch.push({t:'接受外部 offer，提离职', d:'进入离职面谈', to:'exitTalk', star:true});
  if(fl.hrArchive) ch.push({t:'走正式投诉流程', d:`提交 ${S.ev.length} 件证据，HR介入核查`, to:'hrFormal'});
  ch.push({t: fl.offer || fl.hrArchive ? '什么都不做，留下来' : '日子还要过下去', to:'end', act:() => S.ending = 'stay'});
  if(fl.offer) blocks.push(C('猎头 Grace', 'offer 已经发你邮箱啦，薪资涨了25%，周五前给答复就行～'));
  if(fl.hrArchive) blocks.push(N('你的加密文件夹里，四个子目录，按Rat分类，每份都标好了日期和佐证人。'));
  if(!fl.offer && !fl.hrArchive) blocks.push(OS('我没有攒够离开的底气，也没有攒够投诉的证据。'));
  return {loc:'终局 · 选择', blocks, choices:ch};
};

    '你学会了一些东西：留记录、要书面、不在私聊里吵架。',
    '它们还在。但你已经知道它们靠什么得逞了。下一次，你会更早动手。',
  ]},
  burnout:{tag:'ENDING · 失控', title:'工位清空', text:[
    '第二次失控之后，你递交了病假申请。',
    '复工那天，你的工位换了位置，那个「AI提效落地」的群里，括号里还是你们组的名字。',
    '你终于明白：和Rat硬碰硬，最先被消耗掉的是你自己。重新开始吧，这次先攒证据。',
  ]},
};

SC.end = () => {
  const e = ENDINGS[S.ending] || ENDINGS.stay;
  const nOut = Object.keys(S.expelled).length;
  return {loc:'结局', ending:true, blocks:[
    {raw:`<div class="ending-tag">${e.tag}</div>`},
    {raw:`<h2>${e.title}</h2>`},
    ...e.text.map(N),
    {raw:`<div class="verdict">${Object.entries(RATS).map(([k,r]) => S.seen[k] ? `<div class="${S.expelled[k]?'y':''}">${img(k, r.name)}<b>${r.name}</b><em>${S.expelled[k]?'已驱逐':'在逃'}</em></div>` : `<div>${img('unknown')}<b>？？？</b><em>未发现</em></div>`).join('')}</div>`},
    SYS(`看穿 ${Object.keys(S.seen).length} 只｜驱逐 ${nOut} 只｜证据 ${S.ev.length} 件｜组长信任 ${S.trust}｜压力 ${S.stress}`),
    ...(Object.keys(S.seen).length < 4 ? [OS('总觉得……这家公司里，还有我没看穿的人。')] : []),
  ], choices:[{t:'重新上班（重开）', to:'__restart', primary:true}]};
};

SC.title = () => ({loc:'', titleScreen:true, blocks:[], choices:[]});

/* ============ 流程 ============ */
function go(id){
  if(id === '__restart'){ S = fresh(); S.scene = 'intro'; save(); render(); return; }
  if(id === 'next'){ S.day++; S.ap = 3; if(S.day === 3) S.ap = 2; S.morning = morningMessages(); id = 'dayStart'; }
  if(id === 'morning') id = morningRoute();
  if(id === 'evening') id = eveningRoute();
  if(S.stress >= 100 && !['meltdown','end','__out'].includes(id)){
    if((S.flags.melt||0) >= 1){ S.ending = 'burnout'; id = 'end'; }
    else { S.pendingTo = id; id = 'meltdown'; }
  }
  S.scene = id; S.out = null;
  save(); render();
}

function pick(c){
  if(c.ap) S.ap--;
  if(c.act) c.act(S);
  const chips = c.fx ? applyFx(c.fx) : [];
  let to = typeof c.to === 'function' ? c.to(S) : c.to;
  if(!to) to = curScene().next || 'hub';
  const res = c.res ? c.res() : [];
  if(c.reply || res.length || chips.length){
    S.out = {loc:curScene().loc, blocks:[...(c.reply ? [ME(c.reply)] : []), ...res], chips, to};
    S.scene = '__out';
    save(); render();
  } else go(to);
}

let _cur = null;
function curScene(){ return _cur || {}; }

/* ============ 像素精灵 ============ */

// over: [行, 起始列, 像素串]，像素串中的 . 表示不覆盖

  r2:{base:RAT_BASE, col:{G:'#c28552'}, over:[[4,2,'KKKKKKKK'],[4,3,'W']]},                                          // 汶昊：墨镜

  r4:{base:RAT_BASE, col:{G:'#d9a066'}, over:[[4,2,'KWBKKWBK'],[3,2,'KK....KK']]},       // 雯灏：圆眼镜
  me:{base:HUMAN_BASE, col:{H:'#333c57', C:'#41a6f6'}},

  d2:{base:HUMAN_BASE, col:{H:'#c28552', C:'#566c86'}, over:[[2,3,'KKKKKK'],[2,4,'W']]},                                    // 汶昊伪装：棕发 + 墨镜架头顶
  d3:{base:HUMAN_BASE, col:{H:'#b48ead', C:'#5d275d'}, over:[[4,4,'BW.BW'],[5,2,'P......P']]},                                // 玟颢伪装：紫发 + 斜眼
  d4:{base:HUMAN_BASE, col:{H:'#d9a066', C:'#257179'}, over:[[4,2,'KWBKKWBK']]},                                             // 雯灏伪装：黄发 + 眼镜
  unknown:{base:RAT_BASE, col:{G:'#333c57', P:'#333c57', N:'#333c57', W:'#333c57', B:'#333c57', K:'#566c86'}},
};
const _spr = {};
function sprite(id){
  if(_spr[id]) return _spr[id];
  const d = SPRITES[id] || SPRITES.npc;
  const grid = d.base.map(r => r.split(''));
  (d.over || []).forEach(([r,c,str]) => str.split('').forEach((ch,i) => { if(ch !== '.') grid[r][c+i] = ch; }));
  const col = {...BASECOL, ...(d.extra||{}), ...d.col};
  const cv = document.createElement('canvas'); cv.width = 12; cv.height = 12;
  const x = cv.getContext('2d');
  grid.forEach((row,y) => row.forEach((ch,i) => { if(ch !== '.' && col[ch]){ x.fillStyle = col[ch]; x.fillRect(i,y,1,1); } }));
  return (_spr[id] = cv.toDataURL());
}
const img = (id, alt='') => `<img class="px" src="${sprite(id)}" alt="${esc(alt)}">`;
function speakerSprite(who){
  if(who === '你') return 'me';
  for(const k in RATS) if(who.startsWith(RATS[k].name)) return S.seen[k] ? k : 'd' + k.slice(1);
  const map = [['老周','boss'],['小林','lin'],['阿哲','zhe'],['陈蔓','man'],['许姐','hr'],['猎头','hunt']];
  for(const [n,id] of map) if(who.startsWith(n)) return id;
  return 'npc';
}

/* ============ 渲染 ============ */
const esc = s => String(s).replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
const nl = s => esc(s).replace(/\n/g,'<br>');

function dlg(who, text, me){
  const id = speakerSprite(who), isRat = id in RATS;  // 未看穿前是人类头像、普通名牌
  return `<div class="dlg ${me?'me':''} ${isRat?'rat':''}"><div class="face">${img(id, who)}</div><div class="box"><span class="nm">${esc(who)}</span><div>${nl(text)}</div></div></div>`;
}
function blockHTML(b){
  if(b.raw) return b.raw;
  if(b.n) return `<p class="narr">${nl(b.n)}</p>`;
  if(b.os) return `<div class="os"><span class="tag">内心</span>${b.os.split('\n\n').map(p => `<p>${nl(p)}</p>`).join('')}</div>`;
  if(b.sys) return `<p class="sys">${nl(b.sys)}</p>`;
  if(b.h) return `<div class="h3">— ${esc(b.h)} —</div>`;
  if(b.me) return dlg('你', b.me, true);
  if(b.c) return dlg(b.c, b.t, false);
  return '';
}
function chipHTML(c){
  let cls = '';
  if(c.ev) cls = 'ev'; else if(c.expel) cls = 'expel'; else if(c.buff) cls = 'buff';
  else if(c.k === 'stress') cls = c.v < 0 ? 'good' : 'bad';
  else if(c.k === 'alert') cls = 'bad';
  else cls = c.v > 0 ? 'good' : 'bad';
  const txt = c.v ? `${c.label} ${c.v>0?'+':''}${c.v}` : c.label;
  return `<span class="chip ${cls}">${esc(txt)}</span>`;
}

let choiceList = [];
function render(){
  const el = document.getElementById('scene');
  let sc;
  if(S.scene === '__out' && S.out){
    sc = {loc:S.out.loc, blocks:S.out.blocks, chips:S.out.chips, choices:[{t:'继续', to:S.out.to, primary:true}]};
  } else {
    sc = (SC[S.scene] || SC.hub)();
  }
  _cur = sc;
  choiceList = sc.choices;

  if(sc.titleScreen){
    const saved = load();
    const canResume = saved && saved.scene && saved.scene !== 'title' && saved.scene !== 'end';
    el.innerHTML = `<div class="title-screen fade">
      <h1 class="big">GET <span>RATS</span> OUT<br>MY WORLD</h1>
      <p class="cn">一款职场文字冒险。办公室里藏着一些东西，它们长着普通同事的脸，说着体面的话。收集证据，看穿伪装，把它们赶出你的世界。</p>
      <div class="lurk">${img('npc')}${img('npc')}<span class="sus">${img('unknown')}<i>?</i></span>${img('npc')}</div>
      <div class="choices">
        <button class="choice primary" data-i="new"><span class="cur">▶</span><span class="k"></span><span class="t">开始上班</span><span class="d">新游戏 · 约 15 分钟 · 多结局</span></button>
        ${canResume ? `<button class="choice" data-i="resume"><span class="cur">▶</span><span class="k"></span><span class="t">继续存档</span><span class="d">${DAYS[saved.day]||''} · 证据 ${saved.ev.length} 件</span></button>` : ''}
      </div>
      <div class="press">PRESS 1 OR ENTER TO START</div></div>`;
    el.querySelector('[data-i="new"]').onclick = () => { S = fresh(); S.scene = 'intro'; save(); render(); };
    const r = el.querySelector('[data-i="resume"]'); if(r) r.onclick = () => { S = saved; render(); };
    el.querySelector('[data-i="new"]').focus({preventScroll:true});
    renderSide(); renderClock(); return;
  }

  const head = `<div class="scene-head"><span><b>${esc(sc.title || DAYS[S.day])}</b>　${esc(sc.loc||'')}</span><span>${S.scene === 'hub' ? '[ 选择行动 ]' : ''}</span></div>`;
  const dayCard = S.scene === 'dayStart' ? `<div class="daycard"><b>DAY ${S.day}</b><span>${DAYS[S.day]}<br>剩余 ${LAST_DAY - S.day} 天</span></div>` : '';
  const body = dayCard + sc.blocks.map(blockHTML).join('') + (sc.chips && sc.chips.length ? `<div class="h3">— 数值变动 —</div><div class="chips">${sc.chips.map(chipHTML).join('')}</div>` : '');
  let n = 0;
  const ch = sc.choices.map((c,i) => {
    const ok = !c.need || c.need();
    if(!ok && (!c.lock || (c.rat && !S.seen[c.rat]))) return '';
    const num = ok ? ++n : '';
    const cls = ['choice', c.primary?'primary':'', c.star && ok?'star':'', !ok?'locked':''].join(' ');
    const desc = !ok ? '锁 ' + c.lock : c.d;
    return `<button class="${cls}" data-i="${i}" ${ok ? `data-n="${num}"` : 'aria-disabled="true"'}><span class="cur">▶</span><span class="k">${ok ? num + '.' : '✕'}</span><span class="t">${esc(c.t)}</span>${desc ? `<span class="d">${esc(desc)}</span>` : ''}</button>`;
  }).join('');
  el.innerHTML = `<div class="fade">${head}<div class="scene-body">${body}</div><div class="choices">${ch}</div></div>`;
  el.querySelectorAll('.choice').forEach(b => b.onclick = () => {
    const c = choiceList[+b.dataset.i]; if(!c || (c.need && !c.need())) return;
    pick(c);
  });
  if(window.matchMedia('(max-width:880px)').matches) el.scrollIntoView({block:'start'});
  else window.scrollTo({top:0});
  renderSide(); renderClock(); showReveal();
}

function renderClock(){
  const el = document.getElementById('clock');
  if(S.scene === 'title'){ el.innerHTML = ''; return; }
  el.innerHTML = `<span class="day">${DAYS[S.day]}</span><span class="pips" title="今日剩余行动">AP ${[0,1,2].map(i => `<i class="${i < S.ap ? 'on':''}"></i>`).join('')}</span><button class="iconbtn" id="toTitle">MENU</button>`;
  document.getElementById('toTitle').onclick = () => { S.scene = 'title'; render(); };
}

const seg = (v, cls) => `<div class="seg ${cls}">${Array.from({length:10}, (_,i) => `<i class="${i < Math.round(v/10) ? 'on':''}"></i>`).join('')}</div>`;
let evSel = null;
function renderSide(){
  const el = document.getElementById('side');
  const row = (label, v, cls) => `<div class="stat"><span>${label}</span>${seg(v, cls)}<span class="v">${v}</span></div>`;
  const debuffs = [];
  if(f().nag && !S.expelled.r1) debuffs.push('<span class="chip bad">闻灏持续催办</span>');
  if(f().rumorSpread && !S.expelled.r3) debuffs.push('<span class="chip bad">谣言扩散</span>');
  if(f().b4) debuffs.push('<span class="chip good">跨组须书面对齐</span>');
  if(f().ruleProposed) debuffs.push('<span class="chip good">认领流程草案</span>');
  if(f().hrArchive) debuffs.push('<span class="chip ev">HR留档</span>');
  const tab = S.tab || 'rats';

    content = `<div class="rats">${found.map(([k,r]) => {
      const seen = S.seen[k], out = S.expelled[k];
      return `<button class="rat ${seen?'':'unseen'} ${out?'out':''}" data-rat="${k}">
        ${img(seen ? k : 'unknown')}
        <div><div class="nm">${seen ? r.name : '？？？'}${seen ? `<em>${out?'已驱逐':'活跃'}</em>` : ''}</div>
        <div class="tg">${seen ? r.tag : '尚未现身'}</div>
        <div class="stat" style="margin:0"><span>戒备</span>${seg(seen ? S.alert[k] : 0, 'alert')}<span class="v">${seen ? S.alert[k] : '--'}</span></div></div></button>`;
    }).join('')}${more}</div>`;
  } else if(tab === 'ev'){

      <div class="evdesc">${sel ? `<b>${sel}｜${EV[sel].name}</b><br>${EV[sel].desc}` : S.ev.length ? `已收集 ${S.ev.length} 件。点格子查看详情。` : '还没有任何证据。证据藏在工单、考勤、聊天记录和人心里。'}</div>`;
  } else {
    content = S.log.length ? `<div class="log">${S.log.map(l => `<div>${esc(l)}</div>`).join('')}</div>` : '<p class="empty">还没有发生任何事。</p>';
  }
  el.innerHTML = `
    <section class="panel win"><span class="win-title">STATUS</span>
      ${row('压力值', S.stress, 'stress' + (S.stress >= 75 ? ' hot' : ''))}${row('组长信任', S.trust, 'trust')}${row('中立好感', S.neutral, 'neutral')}
      <div class="stat"><span>业务产出</span><div class="outdots">${[0,1,2,3,4].map(i => `<i class="${i<S.output?'on':''}"></i>`).join('')}</div><span class="v">${S.output}</span></div>
      ${debuffs.length ? `<div class="debuffs">${debuffs.join('')}</div>` : ''}
    </section>
    <section class="panel win"><span class="win-title">${tab === 'rats' ? 'RAT 图鉴' : tab === 'ev' ? 'ITEMS 证据库' : 'LOG 日志'}</span>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" aria-selected="${tab==='rats'}" data-tab="rats">图鉴 ${Object.keys(S.seen).length}</button>
        <button class="tab" role="tab" aria-selected="${tab==='ev'}" data-tab="ev">证据 ${S.ev.length}</button>
        <button class="tab" role="tab" aria-selected="${tab==='log'}" data-tab="log">日志</button>
      </div>${content}
    </section>`;
  el.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; save(); renderSide(); });
  el.querySelectorAll('[data-rat]').forEach(b => b.onclick = () => openRat(b.dataset.rat));
  el.querySelectorAll('[data-ev]').forEach(b => b.onclick = () => { if(has(b.dataset.ev)){ evSel = b.dataset.ev; renderSide(); } });
}

function openRat(k){
  const r = RATS[k], m = document.getElementById('modal');

  else m.innerHTML = `<div class="card win"><span class="win-title">RAT FILE · ${RAT_TEMPLATE.tag}</span>
    <div class="hd">${img(k, r.name)}<div><div class="nm">${r.name}</div><div class="sys" style="margin-top:6px">${S.expelled[k]?'已驱逐':'活跃中'} · 戒备 ${S.alert[k]}</div></div></div>

function showReveal(){
  const m = document.getElementById('modal');
  if(!S.reveal || !S.reveal.length || !m.hidden) return;
  const k = S.reveal[0], r = RATS[k], n = Object.keys(S.seen).length;
  const line = n === 1
    ? '披着普通同事外壳的东西，终于露出了尾巴。<br>你给它起了一个名字：<b>文浩系蛀虫</b>。'
    : n === 2 ? '又是一只。<br>你盯着这个名字看了很久——<b>wén hào</b>。同一个读音。<br>同根蛀虫，不同伪装。'
    : '又是 <b>wén hào</b>。<br>你已经不觉得这是巧合了。';
  m.innerHTML = `<div class="card win reveal"><span class="win-title">！ 图鉴更新</span>

  m.onclick = e => { if(e.target === m) close(); };
}

/* 键盘：数字键直选，↑↓ 移动光标，Enter 确认 */
document.addEventListener('keydown', e => {
  const m = document.getElementById('modal');
  if(e.key === 'Escape'){ if(!m.hidden && m.querySelector('.reveal')) m.querySelector('#mclose').click(); else m.hidden = true; return; }
  if(!m.hidden || e.metaKey || e.ctrlKey || e.altKey) return;
  const btns = [...document.querySelectorAll('#scene .choice:not(.locked)')];
  if(!btns.length) return;
  if(/^[1-9]$/.test(e.key)){
    const b = btns.find(x => x.dataset.n === e.key) || (e.key === '1' ? btns[0] : null);
    if(b){ e.preventDefault(); b.click(); }
  } else if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
    e.preventDefault();
    const i = btns.indexOf(document.activeElement);
    const j = i < 0 ? 0 : (i + (e.key === 'ArrowDown' ? 1 : -1) + btns.length) % btns.length;
    btns[j].focus();
  } else if(e.key === 'Enter' && !btns.includes(document.activeElement) && document.activeElement?.closest?.('#side') == null){
    e.preventDefault(); btns[0].click();
  }
});

/* 热更新时保留进度 */
window.claude?.hot?.snapshot?.(() => S);
const start = d => { if(d && d.scene) S = d; render(); };
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? null);
</script>
