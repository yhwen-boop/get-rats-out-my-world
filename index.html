<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Get Rats Out My World</title>
<meta name="theme-color" content="#0d0e1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="驱鼠办公室">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<style>
/* 与 Artifact 外壳一致的基础样式：刘海/底部横条安全区、隐藏元素 */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:#0d0e1a}
[hidden]{display:none!important}
</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: 手机优先的"打工人日常"小游戏。顶部状态卡（日期/时钟/三条数值），中间是地点插画 + 站在画里的同事 + 圆角行动按钮，底部四个页签；对话是视觉小说式底部气泡。单一亮色主题：薄荷绿底 + 白卡片 + 珊瑚色强调 */
:root{
  --bg:#E4F5EE;        /* 薄荷底 */
  --card:#FFFFFF;
  --soft:#F4F1FB;      /* 浅薰衣草，次级卡片 */
  --ink:#2E2A3B;
  --muted:#8A86A0;
  --line:#E7E3F0;
  --coral:#FF8A7A;     /* 主强调 */
  --coral-d:#E96A5A;
  --sky:#7CC6FE;
  --sun:#FFD66B;
  --mint:#5CCB9F;
  --pink:#FF9EC4;
  --grape:#A98BFF;
  --f-disp:"ZCOOL KuaiLe","PingFang SC","Microsoft YaHei",sans-serif;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  background-image:radial-gradient(rgba(92,203,159,.18) 1.5px,transparent 1.5px);background-size:22px 22px}
button{font:inherit;color:inherit;-webkit-appearance:none;appearance:none;border:0;background:none;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--grape);outline-offset:2px}
.app{max-width:460px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding-inline:14px;padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}

/* 顶部状态卡 */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-top:10px;background:var(--card);border-radius:22px;padding:12px 14px;box-shadow:0 6px 0 rgba(46,42,59,.06),0 10px 24px rgba(46,42,59,.06)}
.hud-top{display:flex;align-items:center;gap:10px}
.date{font-size:12px;font-weight:700;background:var(--soft);color:var(--grape);padding:3px 10px;border-radius:99px}
.clock{font-family:var(--f-disp);font-size:30px;line-height:1;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.money{margin-left:auto;font-weight:700;font-size:14px;background:#FFF4D1;color:#B07A00;padding:3px 10px;border-radius:99px;font-variant-numeric:tabular-nums}
.meters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}
.meter{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
.meter b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.meter .top{display:flex;justify-content:space-between}
.bar{height:9px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .4s cubic-bezier(.3,1.4,.5,1)}
.bar.energy i{background:var(--sun)} .bar.mood i{background:var(--pink)} .bar.perf i{background:var(--mint)}
.bar.low i{background:var(--coral)}

/* 地点 */
.view{margin-top:14px;display:flex;flex-direction:column;gap:14px}
.place-head{display:flex;align-items:center;gap:10px}
.place-head h1{font-family:var(--f-disp);font-weight:400;font-size:26px;margin:0;line-height:1.1}
.place-head .move{margin-left:auto;background:var(--ink);color:#fff;font-weight:700;font-size:13px;padding:8px 14px;border-radius:99px;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.place-head .move:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.stage{position:relative;border-radius:24px;overflow:hidden;background:var(--card);box-shadow:0 6px 0 rgba(46,42,59,.07)}
.stage svg.bgart{display:block;width:100%;height:auto}
.cast{position:absolute;left:0;right:0;bottom:6px;display:flex;justify-content:center;gap:4px;padding-inline:8px;flex-wrap:wrap}
.person{display:flex;flex-direction:column;align-items:center;animation:idle 2.4s ease-in-out infinite}
.person:nth-child(2){animation-delay:.5s}.person:nth-child(3){animation-delay:1s}.person:nth-child(4){animation-delay:1.5s}
.person .av{width:62px;height:62px;filter:drop-shadow(0 3px 0 rgba(46,42,59,.12))}
.person .tag{font-size:11px;font-weight:700;background:var(--card);padding:0 8px;border-radius:99px;margin-top:-4px;box-shadow:0 2px 0 rgba(46,42,59,.08)}
.person .tag.new{background:var(--coral);color:#fff}
.person:active .av{transform:scale(.94)}
.cast.crowd{gap:0}.cast.crowd .person .av{width:50px;height:50px}
@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.recent{background:var(--card);border-radius:16px;padding:10px 14px;font-size:14px;color:var(--muted);display:flex;gap:8px;align-items:flex-start}
.recent b{color:var(--ink);font-weight:500}
.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.act{background:var(--card);border-radius:18px;padding:12px;text-align:left;display:flex;gap:10px;align-items:center;box-shadow:0 5px 0 rgba(46,42,59,.07);transition:transform .1s;min-width:0}
.act:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(46,42,59,.07)}
.act .ic{font-size:26px;line-height:1;width:42px;height:42px;border-radius:14px;background:var(--soft);display:grid;place-items:center;flex:none}
.act .tx{min-width:0}
.act .t{font-weight:700;font-size:14px;line-height:1.3;display:block}
.act .d{font-size:12px;color:var(--muted);line-height:1.35;display:block}
.act.hot{background:#FFF0EC}.act.hot .ic{background:#FFD9D2}
.act.off{opacity:.55}
.act.wide{grid-column:1 / -1}

/* 页签 */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px));pointer-events:none}
.tabbar .in{pointer-events:auto;max-width:432px;width:100%;background:var(--ink);border-radius:24px;display:grid;grid-template-columns:repeat(4,1fr);padding:6px;box-shadow:0 8px 24px rgba(46,42,59,.25)}
.tabbar button{color:#B9B5CC;font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;border-radius:18px;position:relative}
.tabbar button .i{font-size:20px;line-height:1.1}
.tabbar button[aria-selected="true"]{background:rgba(255,255,255,.12);color:#fff}
.badge{position:absolute;top:2px;right:calc(50% - 24px);min-width:18px;height:18px;border-radius:99px;background:var(--coral);color:#fff;font-size:11px;line-height:18px;padding:0 5px}

/* 通用卡片列表 */
.sec-title{font-family:var(--f-disp);font-weight:400;font-size:26px;margin:2px 0 0}
.card{background:var(--card);border-radius:20px;padding:14px;box-shadow:0 5px 0 rgba(46,42,59,.06)}
.task{display:flex;flex-direction:column;gap:8px}
.task .row{display:flex;gap:8px;align-items:flex-start}
.task .nm{font-weight:700;line-height:1.4;flex:1;min-width:0}
.pill{font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--soft);color:var(--grape);white-space:nowrap}
.pill.due{background:#FFE3DE;color:var(--coral-d)}
.pill.ok{background:#DDF5EA;color:#2F9B70}
.task .bar i{background:var(--sky)}
.task.done{opacity:.7}.task.done .bar i{background:var(--mint)}
.task.focus{box-shadow:0 0 0 3px var(--sky),0 5px 0 rgba(46,42,59,.06)}
.task .meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.focusbtn{font-size:12px;font-weight:700;color:#3D9BE0;white-space:nowrap}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:24px 0;margin:0}
.people{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pc{background:var(--card);border-radius:18px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 5px 0 rgba(46,42,59,.06);text-align:center;min-width:0}
.pc .av{width:60px;height:60px}
.pc b{font-size:14px}
.pc small{font-size:11px;color:var(--muted);line-height:1.3}
.hearts{font-size:11px;color:var(--pink);letter-spacing:1px}
.pc.rat{background:#FFF0F3}
.ratchip{display:inline-block;font-size:10px;font-weight:700;background:var(--coral);color:#fff;border-radius:99px;padding:0 7px;line-height:1.7}
.msg{display:flex;gap:10px;align-items:flex-start}
.msg .av{width:42px;height:42px;flex:none}
.msg .bd{background:var(--card);border-radius:4px 16px 16px 16px;padding:8px 12px;font-size:14px;min-width:0;box-shadow:0 3px 0 rgba(46,42,59,.05)}
.msg .who{font-size:12px;color:var(--muted)}
.msg.unread .bd{box-shadow:0 0 0 2px var(--coral)}

/* 对话 */
.dlg{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(46,42,59,.28);padding:0 12px calc(12px + env(safe-area-inset-bottom,0px))}
.dlg .box{max-width:460px;width:100%;margin:0 auto;background:var(--card);border-radius:26px;padding:16px 16px 14px;position:relative;box-shadow:0 10px 40px rgba(46,42,59,.25);animation:up .22s cubic-bezier(.3,1.4,.5,1)}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.dlg .face{position:absolute;top:-58px;left:16px;width:84px;height:84px;background:var(--card);border-radius:50%;padding:6px;box-shadow:0 6px 0 rgba(46,42,59,.08)}
.dlg .face .av{width:72px;height:72px}
.dlg .name{margin-left:96px;font-weight:700;font-size:15px;display:flex;gap:6px;align-items:center;min-height:24px;flex-wrap:wrap}
.dlg .name small{font-weight:400;color:var(--muted);font-size:12px}
.dlg .text{font-size:16px;line-height:1.75;margin-top:10px;min-height:3.4em}
.dlg.narr .face{display:none}.dlg.narr .name{margin-left:0;color:var(--muted);font-size:12px}
.dlg.narr .text{color:#55506A}
.dlg .next{display:block;text-align:right;margin-top:6px;font-size:13px;color:var(--muted);animation:nudge 1s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(3px)}}
.dlg .choices{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.dlg .ch{background:var(--soft);border-radius:16px;padding:11px 14px;text-align:left;font-weight:500;line-height:1.45}
.dlg .ch small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.dlg .ch:active{background:#E7E1FA}
.dlg .ch.main{background:var(--coral);color:#fff}.dlg .ch.main small{color:#FFE8E4}

/* 底部面板 */
.sheet{position:fixed;inset:0;z-index:45;background:rgba(46,42,59,.3);display:flex;align-items:flex-end;justify-content:center}
.sheet .in{background:var(--bg);width:100%;max-width:460px;border-radius:28px 28px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom,0px));max-height:85vh;max-height:85dvh;overflow:auto;animation:up .22s cubic-bezier(.3,1.4,.5,1)}
.sheet h2{font-family:var(--f-disp);font-weight:400;font-size:24px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.sheet h2 button{font-family:var(--f-body);font-size:13px;color:var(--muted);padding:6px 10px}
.locs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.loc{background:var(--card);border-radius:18px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:4px;box-shadow:0 5px 0 rgba(46,42,59,.06);min-width:0}
.loc .t{font-weight:700;display:flex;gap:6px;align-items:center}
.loc .t span{font-size:20px}
.loc .who{display:flex;gap:2px;min-height:28px;flex-wrap:wrap}
.loc .who .av{width:28px;height:28px}
.loc small{font-size:11px;color:var(--muted)}
.loc.here{box-shadow:0 0 0 3px var(--coral),0 5px 0 rgba(46,42,59,.06)}
.loc:disabled{opacity:.5;cursor:default}

/* 飘字 */
.toasts{position:fixed;left:0;right:0;top:calc(128px + env(safe-area-inset-top,0px));z-index:60;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:var(--ink);color:#fff;font-weight:700;font-size:13px;padding:6px 14px;border-radius:99px;animation:pop 1.9s ease forwards;box-shadow:0 6px 18px rgba(46,42,59,.25)}
.toast.good{background:var(--mint)}.toast.bad{background:var(--coral)}.toast.gold{background:var(--sun);color:#5A4300}
@keyframes pop{0%{transform:translateY(10px) scale(.9);opacity:0}12%{transform:none;opacity:1}80%{opacity:1}100%{transform:translateY(-14px);opacity:0}}

/* 大卡片（标题/早晨/晚上/揭露/结局） */
.big{display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;padding:26px 20px}
.big h1{font-family:var(--f-disp);font-weight:400;font-size:34px;line-height:1.15;margin:0;text-wrap:balance}
.big h1 em{font-style:normal;color:var(--coral)}
.big p{margin:0;color:#55506A;max-width:28em}
.big .row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.big .row .av{width:56px;height:56px}
.btn{background:var(--coral);color:#fff;font-weight:700;font-size:16px;padding:13px 28px;border-radius:99px;box-shadow:0 5px 0 var(--coral-d);width:100%;max-width:300px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--coral-d)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 5px 0 rgba(46,42,59,.12)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;width:100%}
.stats div{background:var(--soft);border-radius:14px;padding:8px 10px;text-align:left;font-size:13px;color:var(--muted)}
.stats b{display:block;color:var(--ink);font-size:18px;font-variant-numeric:tabular-nums}
.grade{font-family:var(--f-disp);font-size:72px;line-height:1;color:var(--coral)}
.reveal .av{width:120px;height:120px;animation:wob .6s ease 2}
@keyframes wob{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app" id="app">
  <header class="hud" id="hud" hidden></header>
  <main class="view" id="view"></main>
</div>
<nav class="tabbar" id="tabbar" hidden></nav>
<div class="dlg" id="dlg" hidden></div>
<div class="sheet" id="sheet" hidden></div>
<div class="toasts" id="toasts"></div>

<script>
/* =================== 角色 =================== */
const CHARS = {
  me:   {name:'我', hair:'#3B3A57', style:'short', shirt:'#7CC6FE'},
  lin:  {name:'小林', role:'同组搭子', hair:'#7A4E3A', style:'bob', shirt:'#9EE6B8',
         facts:['工位抽屉里永远有三种口味的薯片。','其实偷偷在考公，书藏在显示器底下。','说你是TA在这家公司唯一的朋友。']},
  zhe:  {name:'阿哲', role:'同组 · 降噪耳机常驻', hair:'#2D2D3A', style:'spiky', shirt:'#FFD59E', acc:'phones',
         facts:['耳机里放的其实是白噪音，不是音乐。','养了一只叫"需求"的猫。','三年没请过假，因为不知道请假要找谁审批。']},

  amy:  {name:'Amy', role:'行政', hair:'#C97B4A', style:'bun', shirt:'#FFF1A8',
         facts:['公司每台打印机卡纸的姿势她都记得。','下午茶是她自掏腰包补的差价。','知道全公司每个人的生日。']},
  xu:   {name:'许姐', role:'HRBP', hair:'#4A3B52', style:'bob', shirt:'#E9E9F2', acc:'earring',
         facts:['桌上的龟背竹养了六年。','面试过公司一半的人，包括你。','说"有事随时找我"是真心的。']},
  wh1:  {name:'闻灏', role:'隔壁组 · 爱提方案', hair:'#5A5A66', style:'side', shirt:'#FFFFFF', acc:'tie', rat:'越界派活 · 双标',
         facts:['加过两次班，发过六次朋友圈。','提的方案很多，落地的都不是他。','到点就走，从不例外。']},
  wh2:  {name:'汶昊', role:'隔壁组', hair:'#8A5A3C', style:'short', shirt:'#A3B1C2', acc:'shades', rat:'抢功劳 · 改页眉',
         facts:['汇报能力一流。','文件属性里的作者名，经常不是他。','最常说的话："这个是我们一起讨论的。"']},
  wh3:  {name:'玟颢', role:'行政部 · 消息灵通', hair:'#9B7BB0', style:'long', shirt:'#D7B6E8', rat:'传八卦 · 打小报告',
         facts:['茶水间的消息，一半从她这里出去。','另一半，也是。','和每个领导都"很聊得来"。']},
  wh4:  {name:'雯灏', role:'项目经理', hair:'#C59A5B', style:'thin', shirt:'#7FC8C0', acc:'glasses', rat:'画大饼 · 人情绑架',
         facts:['口头禅："大家都在扛。"','从不建工单，只建群。','上线庆功宴@了所有人，除了干活的人。']},
};
const RATS = ['wh1','wh2','wh3','wh4'];
const LOVERS = ['jiang','man'];

/* 卡通头像（SVG） */
const HAIR_BACK = {
  long:'M13 30 Q13 7 32 7 Q51 7 51 30 L53 56 Q32 62 11 56Z',
  bob:'M12 31 Q12 7 32 7 Q52 7 52 31 L52 45 Q32 50 12 45Z',
  bun:'M32 2 a7 7 0 1 0 .1 0Z',
};
const HAIR_FRONT = {
  short:'M14 31 Q12 9 32 9 Q52 9 50 31 Q46 19 32 18 Q20 18 14 31Z',
  bob:'M13 31 Q13 9 32 9 Q51 9 51 31 Q45 21 37 17 Q31 24 21 21 Q16 25 13 31Z',
  long:'M13 31 Q13 9 32 9 Q51 9 51 31 Q45 21 37 17 Q31 24 21 21 Q16 25 13 31Z',
  bun:'M14 30 Q13 10 32 10 Q51 10 50 30 Q45 20 32 19 Q20 19 14 30Z',
  spiky:'M14 29 L15 15 L21 18 L24 8 L30 16 L35 6 L39 15 L46 9 L47 19 L50 29 Q44 20 32 20 Q20 20 14 29Z',
  messy:'M13 31 Q11 11 30 9 Q47 7 51 22 L52 31 Q47 20 41 23 Q37 15 30 22 Q24 17 18 25Z',
  thin:'M15 27 Q18 14 32 13 Q46 14 49 27 Q44 19 32 19 Q20 19 15 27Z',
  side:'M13 31 Q11 9 32 9 Q51 9 50 29 Q40 13 22 22 Q17 25 13 31Z',
};
const SKIN = '#FFE1C9', INK = '#2B2840';
function avatar(id, opt = {}){

function toast(text, cls = ''){
  const el = document.createElement('div'); el.className = 'toast ' + cls; el.textContent = text;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => el.remove(), 2000);
}
function fx(o = {}){
  const sign = v => (v > 0 ? '+' : '') + v;
  if(o.time) S.time += o.time;
  if(o.energy){ S.energy = clamp(S.energy + o.energy); toast(`精力 ${sign(o.energy)}`, o.energy > 0 ? 'good' : 'bad'); }
  if(o.mood){ S.mood = clamp(S.mood + o.mood); toast(`心情 ${sign(o.mood)}`, o.mood > 0 ? 'good' : 'bad'); }
  if(o.money){ S.money += o.money; toast(`¥ ${sign(o.money)}`, 'gold'); }
  if(o.perf){ S.perf += o.perf; toast(`绩效 ${sign(o.perf)}`, o.perf > 0 ? 'good' : 'bad'); }
  if(o.rel) for(const k in o.rel){ S.rel[k] = clamp((S.rel[k] || 0) + o.rel[k]); S.met[k] = true; toast(`${CHARS[k].name} 好感 ${sign(o.rel[k])}`, o.rel[k] > 0 ? 'good' : 'bad'); }
  if(o.item) for(const k in o.item) S.items[k] = (S.items[k] || 0) + o.item[k];
  if(o.task) addTask(...o.task);
  if(o.flag) Object.assign(S.flags, o.flag);
}
function addTask(key, due){
  if(S.tasks.some(t => t.key === key)) return;
  S.tasks.push({key, done:0, due, fin:false, late:false});
  const cur = S.tasks.find(t => t.key === S.focus);
  if(!cur || cur.fin) S.focus = key;
  const n = TASKS[key].name;
  toast('新待办：' + (n.length > 14 ? n.slice(0, 14) + '…' : n));
}

/* =================== 对话引擎 =================== */
let DQ = null;
function talk(conv){
  DQ = {lines:[...(conv.lines || [])], choices:conv.choices || null, end:conv.end || null};
  stepDlg();
}
function stepDlg(){
  if(!DQ) return;
  if(DQ.lines.length){ const [who, text] = DQ.lines.shift(); drawDlg(who, typeof text === 'function' ? text() : text, null); return; }
  if(DQ.choices){
    const ch = DQ.choices.filter(c => !c.need || c.need()); DQ.choices = null;
    if(ch.length){ drawDlg(DQ.lastWho || 'sys', DQ.lastText || '', ch); return; }
  }
  const end = DQ.end; DQ = null;
  document.getElementById('dlg').hidden = true;
  if(end) end(); else afterAction();
}
function drawDlg(who, text, choices){
  DQ.lastWho = who; DQ.lastText = text;
  const el = document.getElementById('dlg'), narr = who === 'sys', c = CHARS[who];
  el.className = 'dlg' + (narr ? ' narr' : '');
  el.innerHTML = `<div class="box">${narr ? '' : `<div class="face">${avatar(who)}</div>`}
    <div class="name">${narr ? '旁白' : c.name}${!narr && c.role ? `<small>${c.role}</small>` : ''}${!narr && S.revealed[who] ? '<span class="ratchip">wén hào</span>' : ''}</div>
    <div class="text">${text}</div>
    ${choices ? `<div class="choices">${choices.map((ch, i) => `<button class="ch ${ch.main ? 'main' : ''}" data-i="${i}">${ch.t}${ch.d ? `<small>${ch.d}</small>` : ''}</button>`).join('')}</div>` : '<span class="next">点击继续 ▾</span>'}</div>`;
  el.hidden = false;
  if(choices){
    el.onclick = null;
    el.querySelectorAll('.ch').forEach(b => b.onclick = e => { e.stopPropagation(); const c2 = choices[+b.dataset.i];
      if(c2.act) c2.act(); if(c2.fx) fx(c2.fx);
      DQ.lines = [...(c2.lines || [])]; DQ.choices = c2.choices || null; if(c2.end) DQ.end = c2.end;
      renderHud(); stepDlg(); });
  } else {
    el.onclick = () => stepDlg();
  }
}
document.addEventListener('keydown', e => {
  const d = document.getElementById('dlg');
  if(!d.hidden && (e.key === 'Enter' || e.key === ' ') && !d.querySelector('.ch')){ e.preventDefault(); stepDlg(); }

});

/* =================== 行动 =================== */
function workEff(){ return (S.energy < 20 ? .5 : S.energy < 45 ? .8 : 1) * (S.mood < 25 ? .7 : 1); }
function doWork(min){
  const t = S.tasks.find(x => x.key === S.focus && !x.fin) || S.tasks.find(x => !x.fin);
  if(!t){ S.last = '手头没有待办了。你把桌面整理了一遍，又整理了一遍。'; fx({time:min, mood:3}); return; }
  const gain = Math.round(min * workEff()), T = TASKS[t.key];
  t.done = Math.min(T.need, t.done + gain);

    S.last = `「${T.name}」推进到 ${Math.round(t.done / T.need * 100)}%。` + (workEff() < 1 ? '（状态不好，效率打折了）' : '');

function afterAction(){
  if(DQ) return;
  if(S.pendingReveal){ const id = S.pendingReveal; S.pendingReveal = null; showReveal(id); return; }
  for(const e of EVENTS){
    if(!S.flags['ev_' + e.id] && e.when()){ if(!e.repeat) S.flags['ev_' + e.id] = true; e.run(); return; }
  }
  if(!S.flags['tasks' + S.day] && DAY_TASKS[S.day]){ S.flags['tasks' + S.day] = true; DAY_TASKS[S.day].forEach(([k,d]) => addTask(k, d)); msg('boss', '今天的活：' + DAY_TASKS[S.day].map(([k]) => TASKS[k].name).join('；')); }
  if(S.time >= 690 && !S.flags['lunchMsg' + S.day] && !S.flags.lunchDate){ S.flags['lunchMsg' + S.day] = true; msg('lin','饭？'); toast('小林：饭？'); }
  if(S.energy <= 0 && S.flags.sleepy !== S.day){ S.flags.sleepy = S.day; talk({lines:[['sys','你的眼皮打架打赢了。你在工位上睡着了四十分钟。'], ['zhe','（轻轻推你）……老周往这边走了。']], end:() => { S.loc = 'desk'; fx({time:40, energy:25}); afterAction(); }}); return; }
  if(S.mood <= 0 && S.flags.emo !== S.day){ S.flags.emo = S.day; talk({lines:[['sys','你盯着屏幕，突然什么都看不进去了。'], ['sys','你去天台站了很久。']], end:() => { S.loc = 'roof'; fx({time:45, mood:30}); afterAction(); }}); return; }
  if(S.time >= 1080 && S.flags.off !== S.day){ S.flags.off = S.day; offWork(); return; }
  save(); render();
}
function offWork(){
  const due = S.tasks.filter(t => !t.fin && t.due <= S.day);
  talk({lines:[['sys', `18:00 到了。${due.length ? `「${TASKS[due[0].key].name}」今天截止，还没做完。` : '今天的活都在掌控之中。'}`]],
    choices:[
      {t:'准点下班！', d:'人间清醒', main:!due.length, end:() => goHome()},
      {t:'加班 1 小时', d:'推进待办 · 精力 -10 心情 -9', main:!!due.length, end:() => { doWork(60); fx({mood:-6}); S.overtimeMin += 60;
        talk({lines:[['sys', S.last]], choices:[{t:'下班', end:() => goHome()}, {t:'再加 1 小时', d:'真的要吗', end:() => { doWork(60); fx({mood:-8}); S.overtimeMin += 60; talk({lines:[['sys', S.last + ' 窗外的天已经黑透了。']], end:() => goHome()}); }}]}); }},
    ]});
}
function goHome(){
  S.tasks.forEach(t => { if(!t.fin && t.due <= S.day && !t.late){ t.late = true; S.perf -= 5; S.rel.boss = clamp(S.rel.boss - 3); msg('boss', `「${TASKS[t.key].name}」怎么样了？尽快给我。`); } });

function night(choice){
  const o = {
    rest:{energy:60, mood:5, text:'你十点就上床了。这是这个月第一次。'},
    drama:{energy:40, mood:15, text:'你追完了三集剧。"就最后一集"这句话你说了三次。'},

    love:{energy:40, mood:14, text:''},

  if(choice === 'love'){ const k = topLover(); o.text = `你和${CHARS[k].name}聊到了十二点。${k === 'jiang' ? '他发来一张画：你的绿萝开了一朵花。' : '她说她的《需求吐槽大全》第一章是写你的。'}`; S.rel[k] = clamp(S.rel[k] + 5); }

  const k = topLover(), canDate = S.partner || S.rel[k] >= 45;
  v.innerHTML = `<div class="big card" style="margin-top:28px"><div class="date" style="font-size:14px">周末</div><h1>两天<em>自由</em></h1>
    <p>${S.flags.weekendWork ? '你答应了雯灏周末来加班。周六的办公室里，只有你和饮水机。' : '你关掉了工作群的消息提醒。这个周末怎么过？'}</p>
    <div class="acts" style="width:100%">${S.flags.weekendWork ? `<button class="act wide" data-w="work"><span class="ic">🏢</span><span class="tx"><span class="t">去加班</span><span class="d">精力 -10 心情 -20 · 没有加班费</span></span></button>` : `
      <button class="act" data-w="home"><span class="ic">🛋️</span><span class="tx"><span class="t">宅家睡到自然醒</span><span class="d">精力满 心情 +10</span></span></button>
      <button class="act" data-w="out"><span class="ic">🎡</span><span class="tx"><span class="t">出门玩</span><span class="d">¥-300 心情 +30</span></span></button>
      ${canDate ? `<button class="act hot wide" data-w="date"><span class="ic">🌸</span><span class="tx"><span class="t">约${CHARS[k].name}出去逛逛</span><span class="d">¥-200 心情 +25 好感 +12</span></span></button>` : ''}`}</div></div>`;
  v.querySelectorAll('[data-w]').forEach(b => b.onclick = () => { const w = b.dataset.w;
    if(w === 'work'){ S.energy = clamp(S.energy - 10); S.mood = clamp(S.mood - 20); S.nightText = '你周末加了班。雯灏在群里发了个"辛苦了🎉"，没有@你。'; }
    if(w === 'home'){ S.energy = 100; S.mood = clamp(S.mood + 10); S.nightText = '你睡了两个十二小时。醒来的时候阳光很好。'; }
    if(w === 'out'){ S.money -= 300; S.energy = clamp(S.energy + 40); S.mood = clamp(S.mood + 30); S.nightText = '你去了海边。手机一整天都没看。'; }
    if(w === 'date'){ S.money -= 200; S.energy = clamp(S.energy + 50); S.mood = clamp(S.mood + 25); S.rel[k] = clamp(S.rel[k] + 12); S.nightText = k === 'jiang' ? '你们去了猫咖。他画了一整页你和猫。' : '你们逛了一下午书店。她买了一本《如何优雅地拒绝别人》，送给了你。'; }
    nextDay(); });
}
function renderEnding(v){
  const p = S.perf, md = S.mood, grade = p >= 120 ? 'S' : p >= 90 ? 'A' : p >= 55 ? 'B' : 'C';
  const good = grade === 'S' || grade === 'A';
  const [title, text] = S.flags.rule ? ['规则制定者','你没有赢下每一场对线，但你让"口头派活"这件事，在这家公司里变得不可能。']
    : good && md >= 60 ? ['人间清醒打工人','活干完了，班准点下了，心情也没丢。这大概就是打工的最优解。']
    : good ? ['卷王','绩效很好看。黑眼圈也是。记得休息。']
    : md >= 60 ? ['摸鱼宗师','你把摸鱼修炼成了一门艺术。老周看你的眼神很复杂。']
    : ['打工人，辛苦了','这两周不容易。但工资还是到账了。'];
  const best = Object.keys(S.rel).filter(k => !RATS.includes(k) && k !== 'boss' && S.met[k]).sort((a,b) => S.rel[b] - S.rel[a])[0];
  const nr = Object.keys(S.revealed).length;
  v.innerHTML = `<div class="big card" style="margin-top:28px"><div class="date" style="font-size:14px">W2 周五 · 发薪日</div>
    <div class="grade">${grade}</div><h1>${title}</h1><p>${text}</p>
    <div class="stats"><div>💰 工资到账<b>¥9800</b></div><div>⭐ 绩效分<b>${p}</b></div><div>💗 最终心情<b>${md}</b></div><div>🐭 看穿 wén hào<b>${nr} / 4</b></div></div>
    <div class="row">${RATS.map(k => S.revealed[k] ? avatar(k) : avatar(k, {ghost:true})).join('')}</div>
    ${S.partner ? `<p>💌 ${S.partner === 'jiang' ? '下班的时候，江屿在楼下等你。他说："发工资了，我请你吃饭团。"' : '陈蔓在你工位上留了一杯美式，杯套上写着：「发工资快乐。周末的展，别迟到。」'}</p>`
      : best ? `<p>这两周和你最要好的，是${CHARS[best].name}。</p>` : ''}
    ${nr < 4 ? '<p style="font-size:13px;color:var(--muted)">办公室里，好像还有你没看穿的人……</p>' : ''}
    <button class="btn" id="again">再打一次工</button></div>`;
  v.querySelector('#again').onclick = () => { S = fresh(); save(); render(); };
}
function showReveal(id){
  const c = CHARS[id], el = document.getElementById('sheet'), n = Object.keys(S.revealed).length;
  el.innerHTML = `<div class="in"><div class="big reveal"><div class="date">看穿了！</div><div style="width:120px">${avatar(id)}</div>
    <h1>${c.name}<br><em>是只 wén hào</em></h1><p>${n === 1 ? '披着普通同事外壳的东西，终于露出了耳朵和胡子。' : n === 2 ? '又是一只。同一个读音：wén hào。你开始觉得这不是巧合。' : '又是 wén hào。你已经见怪不怪了。'}</p>
    <span class="ratchip" style="font-size:12px;padding:2px 10px">${c.rat}</span><button class="btn" id="okReveal">记下来</button></div></div>`;
  el.hidden = false; el.onclick = null;
  el.querySelector('#okReveal').onclick = () => { closeSheet(); afterAction(); };
}

/* 热更新时保留进度 */
window.claude?.hot?.snapshot?.(() => S);
const boot = d => { S = d && d.v === 2 ? Object.assign(fresh(), d) : fresh(); render(); };
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? null);
</script>
</body>
</html>
